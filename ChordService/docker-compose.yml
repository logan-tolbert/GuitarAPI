services:
  chordapi:
    build:
      context: ./src/ChordAPI
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ConnectionStrings__ChordDB=Server=chorddatabase;Database=Chords;User Id=sa;Password=YourStrong(!)Password123;
    depends_on:
      - chorddatabase

  chorddatabase:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chorddatabase
    environment:
      SA_PASSWORD: "YourStrong(!)Password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - chorddata:/var/opt/mssql

volumes:
  chorddata:
